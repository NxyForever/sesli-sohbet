<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NXY SESLİ</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Rajdhani', sans-serif; 
            background: #060913; 
            color: #0ff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
            overflow: hidden;
            background-image: radial-gradient(circle at center, #0f172a 0%, #060913 100%);
            padding: 15px;
        }

        /* İstediğin Şeffaf, Neon ve Buzlu Cam Tasarım */
        .hud-container {
            background: rgba(10, 15, 30, 0.45);
            border: 1px solid rgba(0, 255, 255, 0.3);
            box-shadow: 0 10px 30px rgba(0, 255, 255, 0.15), inset 0 0 20px rgba(0, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 40px 25px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 26px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #0ff;
            letter-spacing: 2px;
        }

        .description { font-size: 14px; color: #8a9fc4; margin-bottom: 25px; }

        input {
            width: 100%;
            padding: 14px;
            background: rgba(0, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 255, 0.4);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            border-radius: 8px;
            outline: none;
            text-align: center;
            margin-bottom: 15px;
            transition: 0.3s;
        }
        input:focus { border-color: #0ff; box-shadow: 0 0 15px rgba(0, 255, 255, 0.4); background: rgba(0, 255, 255, 0.1); }

        button {
            width: 100%;
            padding: 14px;
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            background: rgba(0, 255, 255, 0.05);
            color: #0ff;
            border: 1px solid #0ff;
            border-radius: 8px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        button:active, button:hover {
            background: rgba(0, 255, 255, 0.2);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
        }

        .btn-danger { border-color: #ff0055; color: #ff0055; }
        .btn-danger:active, .btn-danger:hover { background: rgba(255, 0, 85, 0.15); box-shadow: 0 0 15px rgba(255, 0, 85, 0.5); }

        #status { font-size: 15px; margin-bottom: 15px; font-weight: bold; text-transform: uppercase; height: 20px;}
        
        .controls { display: none; margin-top: 15px; }
        
        /* Tamamen Şeffaf Dalga Gösterici Ekranı */
        canvas {
            width: 100%;
            height: 70px;
            background: transparent;
            margin-bottom: 15px;
            display: none;
        }

        .info-box {
            background: rgba(0, 255, 255, 0.03);
            border-left: 3px solid #0ff;
            padding: 15px;
            font-size: 13px;
            text-align: left;
            color: #8a9fc4;
            margin-top: 20px;
            line-height: 1.5;
            border-radius: 0 8px 8px 0;
        }
        .info-box span { color: #0ff; font-weight: bold; }

    </style>
</head>
<body>

    <div class="hud-container">
        <h1>NXY SESLİ</h1>
        <p class="description">Saf Ses & Şeffaf Arayüz</p>
        
        <div id="setupScreen">
            <input type="text" id="roomName" placeholder="ODA ADINI YAZIN" autocomplete="off">
            <button onclick="joinRoom()">ODAYA BAĞLAN</button>
        </div>

        <p id="status"></p>
        <canvas id="visualizer"></canvas>

        <div id="controlsScreen" class="controls">
            <p style="margin-bottom: 15px; font-size: 16px;">MİKROFON: <span id="micStatus" style="color: #0ff; text-shadow: 0 0 8px #0ff;">AKTİF</span></p>
            <button id="muteBtn" onclick="toggleMute()" class="btn-danger">MİKROFONU KAPAT (M)</button>
            
            <div class="info-box">
                <p>🎙️ <b>Filtre:</b> Özel Bandpass (1850Hz) + Noise Gate</p>
                <p style="margin-top: 5px;">⌨️ <b>Kısayollar:</b> <span>[M]</span> Sustur | <span>[V]</span> Bas-Konuş</p>
            </div>
        </div>

        <audio id="remoteAudio" autoplay></audio>
    </div>

    <script>
        let peer;
        let localStream;
        let isMuted = false;
        let isPttActive = false;
        let audioCtx;
        let biquadFilter;
        let gainNode;

        const statusEl = document.getElementById('status');
        const visualizer = document.getElementById('visualizer');
        const canvasCtx = visualizer.getContext('2d');

        function playSound(type) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                gain.connect(ctx.destination);
                osc.connect(gain);
                osc.frequency.setValueAtTime(type === 'on' ? 600 : 300, ctx.currentTime);
                gain.gain.setValueAtTime(0.05, ctx.currentTime);
                osc.start(); osc.stop(ctx.currentTime + 0.1);
            } catch(e) {}
        }

        // SENİN KUSURSUZ SES AYARLARIN (HİÇ DOKUNULMADI)
        const audioConstraints = {
            audio: {
                echoCancellation: true,
                noiseSuppression: true,
                autoGainControl: false, 
                channelCount: 1 
            },
            video: false
        };

        function joinRoom() {
            const roomInput = document.getElementById('roomName').value.trim().toLowerCase();
            if(!roomInput) return alert("Lütfen bir oda adı girin!");

            document.getElementById('setupScreen').style.display = 'none';
            statusEl.innerText = "SİSTEME BAĞLANILIYOR...";
            statusEl.style.color = "#0ff";

            const hostId = "nxy-mobil-saf-" + roomInput; 
            
            peer = new Peer({ config: { 'iceServers': [ { url: 'stun:stun.l.google.com:19302' } ] } });

            peer.on('open', (id) => {
                const conn = peer.connect(hostId);
                conn.on('open', () => { startCall(hostId); });

                peer.on('error', (err) => {
                    if(err.type === 'peer-unavailable') {
                        peer.destroy();
                        peer = new Peer(hostId, { config: { 'iceServers': [ { url: 'stun:stun.l.google.com:19302' } ] } });
                        peer.on('open', () => {
                            setupMedia();
                            statusEl.innerText = "BAĞLANTI BEKLENİYOR...";
                            statusEl.style.color = "#0ff";
                        });
                        peer.on('call', (call) => {
                            call.answer(localStream);
                            call.on('stream', (remoteStream) => {
                                document.getElementById('remoteAudio').srcObject = remoteStream;
                                statusEl.innerText = "BAĞLANTI AKTİF!";
                            });
                        });
                    }
                });
            });
        }

        function setupMedia(callback) {
            navigator.mediaDevices.getUserMedia(audioConstraints)
                .then((stream) => {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const source = audioCtx.createMediaStreamSource(stream);
                    
                    // SENİN KUSURSUZ BİQUAD FİLTREN (HİÇ DOKUNULMADI)
                    biquadFilter = audioCtx.createBiquadFilter();
                    biquadFilter.type = "bandpass"; 
                    biquadFilter.frequency.value = 1850; 
                    biquadFilter.Q.value = 0.55; 

                    gainNode = audioCtx.createGain();
                    gainNode.gain.value = 1.0; 

                    source.connect(biquadFilter);
                    biquadFilter.connect(gainNode);

                    const destination = audioCtx.createMediaStreamDestination();
                    gainNode.connect(destination);
                    localStream = destination.stream;

                    document.getElementById('controlsScreen').style.display = 'block';
                    visualizer.style.display = 'block';
                    
                    startVisualizer(biquadFilter); 
                    
                    if(callback) callback();
                })
                .catch((err) => { alert("Mikrofon izni şart!"); });
        }

        function startCall(remoteId) {
            setupMedia(() => {
                const call = peer.call(remoteId, localStream);
                call.on('stream', (remoteStream) => {
                    document.getElementById('remoteAudio').srcObject = remoteStream;
                    statusEl.innerText = "BAĞLANTI AKTİF!";
                    statusEl.style.color = "#0ff";
                });
            });
        }

        function startVisualizer(audioNode) {
            const analyser = audioCtx.createAnalyser();
            analyser.fftSize = 256;
            audioNode.connect(analyser);

            // Ses Motoru ve Görselliği Birbirinden Ayırdık!
            const bufferLength = analyser.frequencyBinCount;
            const freqDataArray = new Uint8Array(bufferLength); // Kapı (Gate) için
            const timeDataArray = new Uint8Array(bufferLength); // Dalga Çizgisi için

            function draw() {
                requestAnimationFrame(draw);
                
                // Analizörden her iki veriyi de aynı anda çekiyoruz
                analyser.getByteFrequencyData(freqDataArray); 
                analyser.getByteTimeDomainData(timeDataArray);

                // Görüntüyü temizle (Tamamen Şeffaf)
                canvasCtx.clearRect(0, 0, visualizer.width, visualizer.height);

                // --- 1. SENİN ORİJİNAL NOİSE GATE MANTIĞIN (Kusursuz Ses İçin) ---
                let maxVolume = 0;
                for(let i = 0; i < bufferLength; i++) {
                    if(freqDataArray[i] > maxVolume) maxVolume = freqDataArray[i];
                }
                if (maxVolume < 45) {
                    gainNode.gain.value = 0.0; // Kapıyı kapat
                } else {
                    gainNode.gain.value = 1.0; // Kapıyı aç
                }

                // --- 2. YENİ ŞIK VE CANLI DALGA GÖRÜNÜMÜ ---
                canvasCtx.lineWidth = 3;
                canvasCtx.strokeStyle = '#0ff';
                canvasCtx.shadowBlur = 12;
                canvasCtx.shadowColor = '#0ff';
                canvasCtx.beginPath();

                let sliceWidth = visualizer.width * 1.0 / bufferLength;
                let x = 0;

                for(let i = 0; i < bufferLength; i++) {
                    // Eğer ses kapalıysa dalgayı düzelt, açıksa canlı dalga yap
                    let v = (gainNode.gain.value === 0) ? 128 : timeDataArray[i];
                    
                    // Dalgayı biraz daha belirginleştirmek için genliği artır
                    let genlik = (v - 128) * 2.5 + 128;
                    let y = (genlik / 255.0) * visualizer.height;

                    if(i === 0) canvasCtx.moveTo(x, y);
                    else canvasCtx.lineTo(x, y);

                    x += sliceWidth;
                }
                
                canvasCtx.lineTo(visualizer.width, visualizer.height / 2);
                canvasCtx.stroke();
            }
            draw();
        }

        function toggleMute() {
            if(!localStream) return;
            isMuted = !isMuted;
            localStream.getAudioTracks()[0].enabled = !isMuted;
            
            const statusTxt = document.getElementById('micStatus');
            const btn = document.getElementById('muteBtn');
            
            if(isMuted) {
                playSound('off');
                statusTxt.innerText = "KAPALI";
                statusTxt.style.color = "#ff0055";
                btn.innerText = "MİKROFONU AÇ (M)";
                btn.style.borderColor = "#0ff";
                btn.style.color = "#0ff";
                btn.style.background = "rgba(0, 255, 255, 0.05)";
            } else {
                playSound('on');
                statusTxt.innerText = "AKTİF";
                statusTxt.style.color = "#0ff";
                btn.innerText = "MİKROFONU KAPAT (M)";
                btn.style.borderColor = "#ff0055";
                btn.style.color = "#ff0055";
                btn.style.background = "rgba(255, 0, 85, 0.05)";
            }
        }

        document.addEventListener('keydown', (e) => {
            if(e.target.tagName === 'INPUT') return; 
            if(e.code === 'KeyM') toggleMute();
            if(e.code === 'KeyV' && isMuted && !isPttActive) {
                isPttActive = true;
                localStream.getAudioTracks()[0].enabled = true;
                playSound('on');
                document.getElementById('micStatus').innerText = "KONUŞUYOR (V)";
                document.getElementById('micStatus').style.color = "#ff00ff";
            }
        });

        document.addEventListener('keyup', (e) => {
            if(e.code === 'KeyV' && isMuted && isPttActive) {
                isPttActive = false;
                localStream.getAudioTracks()[0].enabled = false;
                playSound('off');
                document.getElementById('micStatus').innerText = "KAPALI";
                document.getElementById('micStatus').style.color = "#ff0055";
            }
        });
    </script>
</body>
</html>
