<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NXY SESLİ</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Rajdhani', sans-serif; 
            background: #060913; 
            color: #0ff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
            overflow: hidden;
            background-image: radial-gradient(circle at center, #0f172a 0%, #060913 100%);
            padding: 15px;
        }

        .hud-container {
            background: rgba(10, 15, 30, 0.4);
            border: 1px solid rgba(0, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(0, 255, 255, 0.15), inset 0 0 20px rgba(0, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 40px 25px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 26px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #0ff;
            letter-spacing: 2px;
        }

        input {
            width: 100%;
            padding: 14px;
            background: rgba(0, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 255, 0.4);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            border-radius: 8px;
            outline: none;
            text-align: center;
            margin-bottom: 20px;
            transition: 0.3s;
        }
        input:focus { border-color: #0ff; box-shadow: 0 0 15px rgba(0, 255, 255, 0.4); background: rgba(0, 255, 255, 0.1); }

        button {
            width: 100%;
            padding: 14px;
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            background: rgba(0, 255, 255, 0.1);
            color: #0ff;
            border: 1px solid #0ff;
            border-radius: 8px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }
        button:active, button:hover {
            background: rgba(0, 255, 255, 0.25);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
        }

        .btn-danger { border-color: #ff0055; color: #ff0055; background: rgba(255, 0, 85, 0.05); }
        .btn-danger:active, .btn-danger:hover { background: rgba(255, 0, 85, 0.2); box-shadow: 0 0 20px rgba(255, 0, 85, 0.6); }

        #status { font-size: 15px; margin-bottom: 15px; font-weight: bold; text-transform: uppercase; height: 20px; }
        
        .controls { display: none; margin-top: 15px; }
        
        canvas {
            width: 100%;
            height: 80px;
            background: transparent;
            margin-bottom: 15px;
            display: none;
        }

        .info-box {
            background: rgba(0, 255, 255, 0.03);
            border-left: 3px solid #0ff;
            padding: 12px;
            font-size: 13px;
            text-align: left;
            color: #8a9fc4;
            margin-top: 20px;
            line-height: 1.5;
            border-radius: 0 8px 8px 0;
        }
        .info-box span { color: #0ff; font-weight: bold; }

    </style>
</head>
<body>

    <div class="hud-container">
        <h1>NXY SESLİ</h1>
        
        <div id="setupScreen">
            <input type="text" id="roomName" placeholder="ODA ADINI YAZIN" autocomplete="off">
            <button onclick="joinRoom()">ODAYA BAĞLAN</button>
        </div>

        <p id="status"></p>
        <canvas id="visualizer"></canvas>

        <div id="controlsScreen" class="controls">
            <p style="margin-bottom: 15px; font-size: 16px;">MİKROFON: <span id="micStatus" style="color: #0ff; text-shadow: 0 0 8px #0ff;">AKTİF</span></p>
            <button id="muteBtn" onclick="toggleMute()" class="btn-danger">MİKROFONU KAPAT (M)</button>
            
            <div class="info-box">
                <p>🎙️ <b>Gürültü Filtresi:</b> Aktif (300-3400Hz Çiftli Filtre)</p>
                <p style="margin-top: 5px;">⌨️ <b>Kısayollar:</b> <span>[M]</span> Sustur</p>
            </div>
        </div>

        <audio id="remoteAudio" autoplay></audio>
    </div>

    <script>
        let peer;
        let localStream;
        let isMuted = false;
        let audioCtx;
        let gainNode;
        let highpassFilter;
        let lowpassFilter;

        const statusEl = document.getElementById('status');
        const visualizer = document.getElementById('visualizer');
        const canvasCtx = visualizer.getContext('2d');

        const audioConstraints = {
            audio: {
                echoCancellation: true,
                noiseSuppression: true,
                autoGainControl: false, 
                channelCount: 1 
            },
            video: false
        };

        function joinRoom() {
            const roomInput = document.getElementById('roomName').value.trim().toLowerCase();
            if(!roomInput) return alert("Lütfen bir oda adı girin!");

            document.getElementById('setupScreen').style.display = 'none';
            statusEl.innerText = "SİSTEME BAĞLANILIYOR...";
            statusEl.style.color = "#0ff";

            const hostId = "nxy-mobil-v5-" + roomInput; 
            
            peer = new Peer({ config: { 'iceServers': [ { url: 'stun:stun.l.google.com:19302' } ] } });

            peer.on('open', (id) => {
                const conn = peer.connect(hostId);
                conn.on('open', () => { startCall(hostId); });

                peer.on('error', (err) => {
                    if(err.type === 'peer-unavailable') {
                        peer.destroy();
                        peer = new Peer(hostId, { config: { 'iceServers': [ { url: 'stun:stun.l.google.com:19302' } ] } });
                        peer.on('open', () => {
                            setupMedia();
                            statusEl.innerText = "BAĞLANTI BEKLENİYOR...";
                            statusEl.style.color = "#0ff";
                        });
                        peer.on('call', (call) => {
                            call.answer(localStream);
                            call.on('stream', (remoteStream) => {
                                document.getElementById('remoteAudio').srcObject = remoteStream;
                                statusEl.innerText = "";
                            });
                        });
                    }
                });
            });
        }

        function setupMedia(callback) {
            navigator.mediaDevices.getUserMedia(audioConstraints)
                .then((stream) => {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const source = audioCtx.createMediaStreamSource(stream);
                    
                    // 1. Aşama: 300Hz Altını Kes (Kalın Uğultu ve Dip Sesler)
                    highpassFilter = audioCtx.createBiquadFilter();
                    highpassFilter.type = "highpass";
                    highpassFilter.frequency.value = 300;

                    // 2. Aşama: 3400Hz Üstünü Kes (İnce Tizler ve Tıkırtılar)
                    lowpassFilter = audioCtx.createBiquadFilter();
                    lowpassFilter.type = "lowpass";
                    lowpassFilter.frequency.value = 3400;

                    gainNode = audioCtx.createGain();
                    gainNode.gain.value = 1.0; 

                    // Filtreleri birbirine bağlıyoruz
                    source.connect(highpassFilter);
                    highpassFilter.connect(lowpassFilter);
                    lowpassFilter.connect(gainNode);

                    const destination = audioCtx.createMediaStreamDestination();
                    gainNode.connect(destination);
                    localStream = destination.stream;

                    document.getElementById('controlsScreen').style.display = 'block';
                    visualizer.style.display = 'block';
                    
                    startVisualizer(lowpassFilter); 
                    
                    if(callback) callback();
                })
                .catch((err) => { alert("Mikrofon izni şart!"); });
        }

        function startCall(remoteId) {
            setupMedia(() => {
                const call = peer.call(remoteId, localStream);
                call.on('stream', (remoteStream) => {
                    document.getElementById('remoteAudio').srcObject = remoteStream;
                    statusEl.innerText = "";
                });
            });
        }

        // Akıcı, Yavaş ve Daha Şık Dalga Göstericisi (Smoothed Sine Wave)
        function startVisualizer(audioNode) {
            const analyser = audioCtx.createAnalyser();
            analyser.fftSize = 512;
            audioNode.connect(analyser);
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            
            // Dalganın yavaş hareket etmesi için hafıza dizisi
            const smoothData = new Float32Array(bufferLength);
            for(let i=0; i<bufferLength; i++) smoothData[i] = 128;

            function draw() {
                requestAnimationFrame(draw);
                analyser.getByteTimeDomainData(dataArray);
                
                canvasCtx.clearRect(0, 0, visualizer.width, visualizer.height);
                
                canvasCtx.lineWidth = 3;
                canvasCtx.strokeStyle = '#0ff';
                canvasCtx.shadowBlur = 12;
                canvasCtx.shadowColor = '#0ff';
                canvasCtx.beginPath();

                let sliceWidth = visualizer.width * 1.0 / bufferLength;
                let x = 0;
                let maxVolume = 0;

                for(let i = 0; i < bufferLength; i++) {
                    // Interpolation (Yumuşatma): Yeni veriye aniden atlamak yerine yavaşça süzülerek geçer (0.15 hızı)
                    smoothData[i] += (dataArray[i] - smoothData[i]) * 0.15;

                    // Şiddeti artır (Canlılık için)
                    let v = ((smoothData[i] - 128) * 3.5) + 128; 
                    let y = (v / 128.0) * (visualizer.height / 2);

                    // Sınırları taşmasını engelle
                    if(y < 5) y = 5;
                    if(y > visualizer.height - 5) y = visualizer.height - 5;

                    if(i === 0) canvasCtx.moveTo(x, y);
                    else canvasCtx.lineTo(x, y);

                    x += sliceWidth;
                    
                    let volCalc = Math.abs(dataArray[i] - 128);
                    if(volCalc > maxVolume) maxVolume = volCalc;
                }
                
                canvasCtx.lineTo(visualizer.width, visualizer.height / 2);
                canvasCtx.stroke();

                // Düzeltilmiş Hassas Gürültü Kapısı (Eşik: 6) - Sesi asla yutmaz
                if (maxVolume < 6) {
                    gainNode.gain.value = 0.0; 
                } else {
                    gainNode.gain.value = 1.0; 
                }
            }
            draw();
        }

        function toggleMute() {
            if(!localStream) return;
            isMuted = !isMuted;
            localStream.getAudioTracks()[0].enabled = !isMuted;
            
            const statusTxt = document.getElementById('micStatus');
            const btn = document.getElementById('muteBtn');
            
            if(isMuted) {
                statusTxt.innerText = "KAPALI";
                statusTxt.style.color = "#ff0055";
                btn.innerText = "MİKROFONU AÇ (M)";
                btn.style.borderColor = "#0ff";
                btn.style.color = "#0ff";
                btn.style.background = "rgba(0, 255, 255, 0.05)";
            } else {
                statusTxt.innerText = "AKTİF";
                statusTxt.style.color = "#0ff";
                btn.innerText = "MİKROFONU KAPAT (M)";
                btn.style.borderColor = "#ff0055";
                btn.style.color = "#ff0055";
                btn.style.background = "rgba(255, 0, 85, 0.05)";
            }
        }

        document.addEventListener('keydown', (e) => {
            if(e.target.tagName === 'INPUT') return; 
            if(e.code === 'KeyM') toggleMute();
        });
    </script>
</body>
</html>
