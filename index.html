<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NXY SESLİ</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Rajdhani', sans-serif; 
            background: #060913; 
            color: #0ff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
            overflow: hidden;
            background-image: radial-gradient(circle at center, #0f172a 0%, #060913 100%);
            padding: 20px;
        }

        /* Gerçek Şeffaf Buzlu Cam Tasarımı */
        .hud-container {
            background: rgba(0, 15, 30, 0.4);
            border: 1px solid rgba(0, 255, 255, 0.2);
            box-shadow: 0 10px 40px rgba(0, 255, 255, 0.1), inset 0 0 15px rgba(0, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 40px 25px;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            margin-bottom: 25px;
            text-shadow: 0 0 15px rgba(0, 255, 255, 0.8);
            letter-spacing: 2px;
            color: #fff;
        }

        input {
            width: 100%;
            padding: 16px;
            background: rgba(0, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 255, 0.3);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            border-radius: 10px;
            outline: none;
            text-align: center;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }
        input:focus { border-color: #0ff; box-shadow: 0 0 20px rgba(0, 255, 255, 0.3); background: rgba(0, 255, 255, 0.1); }

        button {
            width: 100%;
            padding: 16px;
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            background: rgba(0, 255, 255, 0.1);
            color: #0ff;
            border: 1px solid #0ff;
            border-radius: 10px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
        }
        button:active {
            background: rgba(0, 255, 255, 0.3);
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.8);
            transform: scale(0.98);
        }

        .btn-danger { border-color: #ff0055; color: #ff0055; background: rgba(255, 0, 85, 0.05); box-shadow: 0 0 10px rgba(255, 0, 85, 0.2); }
        .btn-danger:active { background: rgba(255, 0, 85, 0.2); box-shadow: 0 0 25px rgba(255, 0, 85, 0.8); }

        #status { font-size: 16px; margin-bottom: 15px; font-weight: bold; text-transform: uppercase; height: 20px; letter-spacing: 1px; color: #0ff; text-shadow: 0 0 8px #0ff;}
        
        .controls { display: none; margin-top: 10px; }
        
        /* Canlı Dalga Ekranı */
        canvas {
            width: 100%;
            height: 100px;
            background: transparent;
            margin: 10px 0 25px 0;
            display: none;
            border-bottom: 1px solid rgba(0, 255, 255, 0.2);
        }

        .info-box {
            background: rgba(0, 255, 255, 0.03);
            border-left: 3px solid #0ff;
            padding: 15px;
            font-size: 14px;
            text-align: left;
            color: #8a9fc4;
            margin-top: 25px;
            line-height: 1.6;
            border-radius: 0 10px 10px 0;
        }
        .info-box span { color: #0ff; font-weight: bold; }

    </style>
</head>
<body>

    <div class="hud-container">
        <h1>NXY SESLİ</h1>
        
        <div id="setupScreen">
            <input type="text" id="roomName" placeholder="ODA ADINI YAZIN" autocomplete="off">
            <button onclick="joinRoom()">ODAYA BAĞLAN</button>
        </div>

        <p id="status"></p>
        <canvas id="visualizer"></canvas>

        <div id="controlsScreen" class="controls">
            <p style="margin-bottom: 20px; font-size: 18px;">MİKROFON: <span id="micStatus" style="color: #0ff; text-shadow: 0 0 10px #0ff; font-weight: bold;">AKTİF</span></p>
            <button id="muteBtn" onclick="toggleMute()" class="btn-danger">MİKROFONU KAPAT (M)</button>
            
            <div class="info-box">
                <p>🎙️ <b>Ses Motoru:</b> Aktif (Saf Donanımsal HD Ses)</p>
                <p style="margin-top: 5px;">⌨️ <b>Kısayollar:</b> <span>[M]</span> Sustur</p>
            </div>
        </div>

        <audio id="remoteAudio" autoplay></audio>
    </div>

    <script>
        let peer;
        let localStream;
        let isMuted = false;
        let audioCtx;

        const statusEl = document.getElementById('status');
        const visualizer = document.getElementById('visualizer');
        const canvasCtx = visualizer.getContext('2d');

        // YAZILIMSAL FİLTRELER ÇIKARTILDI - SAF DONANIMSAL HD SES
        const audioConstraints = {
            audio: {
                echoCancellation: true,
                noiseSuppression: true,
                autoGainControl: false // Sesin boğuklaşmasını engelleyen tek ve en önemli kural
            },
            video: false
        };

        function joinRoom() {
            const roomInput = document.getElementById('roomName').value.trim().toLowerCase();
            if(!roomInput) return alert("Lütfen bir oda adı girin!");

            document.getElementById('setupScreen').style.display = 'none';
            statusEl.innerText = "SİSTEME BAĞLANILIYOR...";

            const hostId = "nxy-mobil-v6-" + roomInput; 
            
            peer = new Peer({ config: { 'iceServers': [ { url: 'stun:stun.l.google.com:19302' } ] } });

            peer.on('open', (id) => {
                const conn = peer.connect(hostId);
                conn.on('open', () => { startCall(hostId); });

                peer.on('error', (err) => {
                    if(err.type === 'peer-unavailable') {
                        peer.destroy();
                        peer = new Peer(hostId, { config: { 'iceServers': [ { url: 'stun:stun.l.google.com:19302' } ] } });
                        peer.on('open', () => {
                            setupMedia();
                            statusEl.innerText = "BAĞLANTI BEKLENİYOR...";
                        });
                        peer.on('call', (call) => {
                            call.answer(localStream);
                            call.on('stream', (remoteStream) => {
                                document.getElementById('remoteAudio').srcObject = remoteStream;
                                statusEl.innerText = "";
                            });
                        });
                    }
                });
            });
        }

        function setupMedia(callback) {
            navigator.mediaDevices.getUserMedia(audioConstraints)
                .then((stream) => {
                    // Sesi PeerJS'e TERTEMİZ, FİLTRESİZ gönderiyoruz (Kalite burada yatıyor)
                    localStream = stream;

                    // Görselleştirici için sadece kopyasını alıyoruz (Sesi bozmaz)
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const source = audioCtx.createMediaStreamSource(stream);
                    const analyser = audioCtx.createAnalyser();
                    analyser.fftSize = 64; // Dalganın daha kalın ve yumuşak olması için düşürüldü
                    source.connect(analyser); // Analyser'ı çıkışa bağlamıyoruz, sadece okuyoruz

                    document.getElementById('controlsScreen').style.display = 'block';
                    visualizer.style.display = 'block';
                    
                    // Canvas çözünürlüğünü netleştir
                    visualizer.width = visualizer.clientWidth;
                    visualizer.height = visualizer.clientHeight;

                    startVisualizer(analyser); 
                    
                    if(callback) callback();
                })
                .catch((err) => { alert("Mikrofon izni şart!"); });
        }

        function startCall(remoteId) {
            setupMedia(() => {
                const call = peer.call(remoteId, localStream);
                call.on('stream', (remoteStream) => {
                    document.getElementById('remoteAudio').srcObject = remoteStream;
                    statusEl.innerText = "";
                });
            });
        }

        // ÇOK DAHA CANLI, İÇİ DOLGULU NEON FREKANS DALGASI
        function startVisualizer(analyser) {
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);

            function draw() {
                requestAnimationFrame(draw);
                analyser.getByteFrequencyData(dataArray); // Zaman verisi yerine Frekans verisi (Çok daha duyarlı)
                
                canvasCtx.clearRect(0, 0, visualizer.width, visualizer.height);
                
                canvasCtx.lineWidth = 4;
                canvasCtx.strokeStyle = '#0ff';
                canvasCtx.shadowBlur = 15;
                canvasCtx.shadowColor = '#0ff';
                canvasCtx.beginPath();

                let sliceWidth = visualizer.width * 1.0 / bufferLength;
                let x = 0;

                for(let i = 0; i < bufferLength; i++) {
                    // Sesi ekrana orantılı yansıt
                    let v = dataArray[i] / 255.0;
                    let y = visualizer.height - (v * visualizer.height * 0.9);

                    // Çizgiyi asla tam dibe yapıştırma (Hafif bir taban kalsın)
                    if(y > visualizer.height - 4) y = visualizer.height - 4;

                    if(i === 0) canvasCtx.moveTo(x, y);
                    else canvasCtx.lineTo(x, y);

                    x += sliceWidth;
                }
                
                canvasCtx.lineTo(visualizer.width, visualizer.height);
                canvasCtx.lineTo(0, visualizer.height);
                
                // Alt tarafa çok şık bir şeffaf neon dolgu efekti
                let gradient = canvasCtx.createLinearGradient(0, 0, 0, visualizer.height);
                gradient.addColorStop(0, 'rgba(0, 255, 255, 0.3)');
                gradient.addColorStop(1, 'rgba(0, 255, 255, 0)');
                canvasCtx.fillStyle = gradient;
                canvasCtx.fill();

                // Üstteki asıl çizgiyi çiz
                canvasCtx.stroke();
            }
            draw();
        }

        function toggleMute() {
            if(!localStream) return;
            isMuted = !isMuted;
            localStream.getAudioTracks()[0].enabled = !isMuted;
            
            const statusTxt = document.getElementById('micStatus');
            const btn = document.getElementById('muteBtn');
            
            if(isMuted) {
                statusTxt.innerText = "KAPALI";
                statusTxt.style.color = "#ff0055";
                statusTxt.style.textShadow = "0 0 10px #ff0055";
                btn.innerText = "MİKROFONU AÇ (M)";
                btn.style.borderColor = "#0ff";
                btn.style.color = "#0ff";
                btn.style.background = "rgba(0, 255, 255, 0.1)";
            } else {
                statusTxt.innerText = "AKTİF";
                statusTxt.style.color = "#0ff";
                statusTxt.style.textShadow = "0 0 10px #0ff";
                btn.innerText = "MİKROFONU KAPAT (M)";
                btn.style.borderColor = "#ff0055";
                btn.style.color = "#ff0055";
                btn.style.background = "rgba(255, 0, 85, 0.05)";
            }
        }

        document.addEventListener('keydown', (e) => {
            if(e.target.tagName === 'INPUT') return; 
            if(e.code === 'KeyM') toggleMute();
        });
    </script>
</body>
</html>
