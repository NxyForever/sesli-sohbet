<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nxy Sesli Sohbet</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Rajdhani', sans-serif; 
            background: #060913; 
            color: #0ff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
            overflow: hidden;
            background-image: radial-gradient(circle at center, #0f172a 0%, #060913 100%);
            padding: 15px;
            user-select: none; 
            -webkit-user-select: none;
        }

        .hud-container {
            background: rgba(10, 15, 30, 0.9);
            border: 2px solid #0ff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2), inset 0 0 15px rgba(0, 255, 255, 0.05);
            border-radius: 16px;
            padding: 30px 20px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            backdrop-filter: blur(10px);
            position: relative;
        }

        .hud-container::before, .hud-container::after {
            content: ''; position: absolute; width: 15px; height: 15px; border: 2px solid #0ff;
        }
        .hud-container::before { top: -2px; left: -2px; border-right: 0; border-bottom: 0; border-top-left-radius: 16px; }
        .hud-container::after { bottom: -2px; right: -2px; border-left: 0; border-top: 0; border-bottom-right-radius: 16px; }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            margin-bottom: 15px;
            text-shadow: 0 0 8px #0ff;
            letter-spacing: 2px;
        }

        .description { font-size: 14px; color: #8a9fc4; margin-bottom: 20px; }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            background: rgba(0, 255, 255, 0.03);
            border: 1px solid #005577;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            border-radius: 8px;
            outline: none;
            text-align: center;
            margin-bottom: 15px;
            transition: 0.3s;
        }
        input[type="text"]:focus { border-color: #0ff; box-shadow: 0 0 10px rgba(0, 255, 255, 0.3); }

        button {
            width: 100%;
            padding: 14px;
            font-family: 'Orbitron', sans-serif;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            background: transparent;
            color: #0ff;
            border: 2px solid #0ff;
            border-radius: 8px;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        button:active, button:hover {
            background: rgba(0, 255, 255, 0.1);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
        }

        .btn-danger { border-color: #ff0055; color: #ff0055; }
        .btn-danger:active, .btn-danger:hover { background: rgba(255, 0, 85, 0.1); box-shadow: 0 0 15px rgba(255, 0, 85, 0.4); }

        /* Bas Konuş Butonu Sadece Mobilde (Genişlik 768px altı) Görünür */
        .btn-ptt { border-color: #ffaa00; color: #ffaa00; margin-top: 5px; display: none; }
        .btn-ptt.active-ptt { background: rgba(255, 170, 0, 0.2); box-shadow: 0 0 15px rgba(255, 170, 0, 0.6); color: #fff;}

        #status { font-size: 15px; margin-bottom: 15px; font-weight: bold; text-transform: uppercase; }
        
        .controls { display: none; margin-top: 15px; }
        
        canvas {
            width: 100%;
            height: 50px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid #005577; 
            border-radius: 6px;
            margin-bottom: 15px;
            display: none;
        }

        .info-box {
            background: rgba(0, 255, 255, 0.02);
            border-left: 3px solid #0ff;
            padding: 12px;
            font-size: 13px;
            text-align: left;
            color: #7b8ea3;
            margin-top: 15px;
            line-height: 1.4;
        }
        .info-box span { color: #0ff; font-weight: bold; }

        /* Kullanıcı Listesi ve Ses Slider Tasarımları */
        #usersPanel { margin-top: 15px; background: rgba(0, 255, 255, 0.05); padding: 12px; border-radius: 8px; border: 1px solid rgba(0, 255, 255, 0.15); text-align: left;}
        .user-item { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; background: rgba(0,0,0,0.3); padding: 10px 12px; border-radius: 8px; border: 1px solid #005577; }
        .user-info { display: flex; flex-direction: column; text-align: left; }
        .user-name { font-size: 14px; font-weight: bold; }
        .user-role { font-size: 10px; color: #8a9fc4; margin-top: 2px;}
        
        .user-item input[type=range] { width: 80px; height: 4px; appearance: none; background: rgba(0,255,255,0.2); border-radius: 2px; outline: none; margin: 0; }
        .user-item input[type=range]::-webkit-slider-thumb { appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #0ff; cursor: pointer; box-shadow: 0 0 8px #0ff; }

        @media (max-width: 768px) {
            .btn-ptt { display: block; }
        }

        @media (max-height: 600px) {
            body { padding: 5px; }
            .hud-container { padding: 15px; }
            h1 { margin-bottom: 8px; font-size: 20px; }
            .description { margin-bottom: 10px; font-size: 12px; }
            input[type="text"], button { padding: 10px; font-size: 14px; }
        }
    </style>
</head>
<body>

    <div class="hud-container">
        <h1>NXY SESLİ</h1>
        <p class="description">Mobil Uyumlu & Sesli Sohbet Ağı</p>
        
        <div id="setupScreen">
            <input type="text" id="usernameInput" placeholder="KULLANICI ADINIZ" autocomplete="off">
            <input type="text" id="roomName" placeholder="ODA ADINI YAZIN" autocomplete="off">
            <button onclick="joinRoom()">ODAYA BAĞLAN</button>
        </div>

        <p id="status"></p>
        <canvas id="visualizer"></canvas>

        <div id="controlsScreen" class="controls">
            <p style="margin-bottom: 12px; font-size: 16px;">MİKROFON: <span id="micStatus" style="color: #0ff; text-shadow: 0 0 5px #0ff;">AKTİF</span></p>
            <button id="muteBtn" onclick="toggleMute()" class="btn-danger">Mikrofonu Kapat (M)</button>
            <button id="pttBtn" class="btn-ptt">BAS KONUŞ (BASILI TUT)</button>
            
            <!-- Odadakiler Paneli (Sadece Karşıdakiler) -->
            <div id="usersPanel">
                <p style="font-size: 14px; font-weight: bold; color: #0ff; margin-bottom: 5px;">👥 ODADAKİLER (<span id="userCount">1</span>)</p>
                <div id="usersList"></div>
            </div>

            <div class="info-box">
                <p>🎙️ <b>Gürültü Filtresi:</b> Aktif (300-3400Hz Bant Sınırlayıcı + Noise Gate)</p>
                <p style="margin-top: 5px;">⌨️ <b>Masaüstü Kısayolları:</b></p>
                <p><span>[M]</span> Sustur | <span>[V]</span> Bas-Konuş</p>
            </div>
        </div>
    </div>

    <script>
        let peer;
        let localStream;
        let isMuted = false;
        let isPttActive = false;
        let audioCtx;
        
        let biquadFilter;
        let gainNode; 
        let muteGainNode; // Gecikmesiz Mute/PTT için
        
        let myUsername = "";
        let peerNames = {}; 
        let remoteUsers = {}; 

        const statusEl = document.getElementById('status');
        const visualizer = document.getElementById('visualizer');
        const canvasCtx = visualizer.getContext('2d');
        const pttBtn = document.getElementById('pttBtn');

        function playSound(type) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                gain.connect(ctx.destination);
                osc.connect(gain);
                osc.frequency.setValueAtTime(type === 'on' ? 600 : 300, ctx.currentTime);
                gain.gain.setValueAtTime(0.05, ctx.currentTime);
                osc.start(); osc.stop(ctx.currentTime + 0.1);
            } catch(e) {}
        }

        const audioConstraints = {
            audio: {
                echoCancellation: true,
                noiseSuppression: true,
                autoGainControl: false, 
                channelCount: 1 
            },
            video: false
        };

        function updateUserName(peerId, name) {
            peerNames[peerId] = name;
            if(remoteUsers[peerId]) {
                remoteUsers[peerId].name = name;
                renderUserList();
            }
        }

        function joinRoom() {
            myUsername = document.getElementById('usernameInput').value.trim();
            const roomInput = document.getElementById('roomName').value.trim().toLowerCase();
            
            if(!myUsername) return alert("Lütfen bir kullanıcı adı girin!");
            if(!roomInput) return alert("Lütfen bir oda adı girin!");

            document.getElementById('setupScreen').style.display = 'none';
            statusEl.innerText = "SİSTEME BAĞLANILIYOR...";
            statusEl.style.color = "#0ff";

            const hostId = "nxy-mobil-v10-" + roomInput; 
            
            setupMedia(() => {
                peer = new Peer({ config: { 'iceServers': [ { url: 'stun:stun.l.google.com:19302' } ] } });

                peer.on('open', (id) => {
                    const conn = peer.connect(hostId, { metadata: { username: myUsername } });
                    
                    conn.on('open', () => { 
                        conn.send({type: 'name', name: myUsername}); 
                        const call = peer.call(hostId, localStream, { metadata: { username: myUsername } });
                        if(call) handleCall(call, hostId, "Bağlanıyor...");
                    });

                    conn.on('data', (data) => { 
                        if(data.type === 'name') updateUserName(conn.peer, data.name); 
                    });
                });

                peer.on('error', (err) => {
                    if(err.type === 'peer-unavailable') {
                        peer.destroy();
                        peer = new Peer(hostId, { config: { 'iceServers': [ { url: 'stun:stun.l.google.com:19302' } ] } });
                        
                        peer.on('open', () => {
                            statusEl.innerText = "ODA KURULDU, BEKLENİYOR...";
                            statusEl.style.color = "#0ff";
                            renderUserList();
                        });

                        peer.on('connection', (inConn) => {
                            if(inConn.metadata && inConn.metadata.username) updateUserName(inConn.peer, inConn.metadata.username);
                            inConn.on('data', (data) => { if(data.type === 'name') updateUserName(inConn.peer, data.name); });
                            inConn.on('open', () => { inConn.send({type: 'name', name: myUsername}); });
                        });

                        peer.on('call', (incomingCall) => {
                            incomingCall.answer(localStream);
                            let callerName = incomingCall.metadata ? incomingCall.metadata.username : "Bağlanıyor...";
                            handleCall(incomingCall, incomingCall.peer, callerName);
                        });
                    }
                });
            });
        }

        function handleCall(call, peerId, defaultName) {
            setupMedia(() => {
                call.on('stream', (remoteStream) => {
                    if(remoteUsers[peerId] && remoteUsers[peerId].stream === remoteStream) return;

                    const remoteSource = audioCtx.createMediaStreamSource(remoteStream);
                    const remoteGain = audioCtx.createGain();
                    remoteGain.gain.value = 1.0; 
                    
                    remoteSource.connect(remoteGain);
                    remoteGain.connect(audioCtx.destination); 

                    const dummyAudio = document.createElement('audio');
                    dummyAudio.autoplay = true; dummyAudio.muted = true;
                    dummyAudio.srcObject = remoteStream;

                    let finalName = peerNames[peerId] || defaultName;

                    remoteUsers[peerId] = {
                        stream: remoteStream,
                        gainNode: remoteGain,
                        audioEl: dummyAudio,
                        name: finalName
                    };
                    
                    statusEl.innerText = "BAĞLANTI AKTİF!";
                    renderUserList();
                });

                call.on('close', () => {
                    delete remoteUsers[peerId];
                    renderUserList();
                });
            });
        }

        // SADECE KARŞIDAKİLERİ GÖSTEREN LİSTE
        function renderUserList() {
            const list = document.getElementById('usersList');
            const count = document.getElementById('userCount');
            list.innerHTML = "";
            let total = 1; // Biz dahil toplam kişi sayısı
            
            let hasRemoteUsers = false;

            for(let id in remoteUsers) {
                total++;
                hasRemoteUsers = true;
                const u = remoteUsers[id];
                const div = document.createElement('div');
                div.className = "user-item";
                
                div.innerHTML = `
                    <div class="user-info">
                        <span class="user-name" style="color: #fff;">👤 ${u.name}</span>
                        <span class="user-role">Kişinin Sesi (Duyma Seviyesi)</span>
                    </div>
                    <input type="range" min="0" max="3" step="0.1" value="${u.gainNode.gain.value}" title="Sesi Ayarla">
                `;
                
                div.querySelector('input').oninput = (e) => {
                    u.gainNode.gain.value = parseFloat(e.target.value);
                };
                list.appendChild(div);
            }

            if(!hasRemoteUsers) {
                list.innerHTML = `<p style="font-size: 12px; color: #8a9fc4; text-align: center; margin-top: 10px;">Şu an odada sadece sen varsın.</p>`;
            }

            count.innerText = total;
        }

        // KUSURSUZ SES ZİNCİRİ (BOZULMAYAN HALİ)
        function setupMedia(callback) {
            if(localStream) { if(callback) callback(); return; } 

            navigator.mediaDevices.getUserMedia(audioConstraints)
                .then((stream) => {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
                    const source = audioCtx.createMediaStreamSource(stream);
                    
                    biquadFilter = audioCtx.createBiquadFilter();
                    biquadFilter.type = "bandpass"; 
                    biquadFilter.frequency.value = 1850; 
                    biquadFilter.Q.value = 0.55; 

                    gainNode = audioCtx.createGain(); 
                    gainNode.gain.value = 1.0; 

                    muteGainNode = audioCtx.createGain(); 
                    muteGainNode.gain.value = 1.0;

                    // Stabil ve Temiz Ses Zinciri
                    source.connect(biquadFilter);
                    biquadFilter.connect(gainNode);
                    gainNode.connect(muteGainNode);

                    const destination = audioCtx.createMediaStreamDestination();
                    muteGainNode.connect(destination);
                    localStream = destination.stream;

                    document.getElementById('controlsScreen').style.display = 'block';
                    visualizer.style.display = 'block';
                    
                    startVisualizer(biquadFilter); 
                    
                    if(callback) callback();
                })
                .catch((err) => { alert("Mikrofon izni şart!"); });
        }

        function startVisualizer(audioNode) {
            const analyser = audioCtx.createAnalyser();
            analyser.fftSize = 128;
            audioNode.connect(analyser);
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);

            function draw() {
                requestAnimationFrame(draw);
                analyser.getByteFrequencyData(dataArray);
                canvasCtx.fillStyle = '#060913';
                canvasCtx.fillRect(0, 0, visualizer.width, visualizer.height);
                
                const barWidth = (visualizer.width / bufferLength) * 2;
                let barHeight;
                let x = 0;

                let maxVolume = 0;
                for(let i = 0; i < bufferLength; i++) {
                    if(dataArray[i] > maxVolume) maxVolume = dataArray[i];
                }

                if (maxVolume < 45) {
                    gainNode.gain.value = 0.0; 
                } else {
                    gainNode.gain.value = 1.0; 
                }

                for(let i = 0; i < bufferLength; i++) {
                    let v = (muteGainNode.gain.value === 0 || gainNode.gain.value === 0) ? 0 : dataArray[i] / 3.5;
                    barHeight = v;
                    canvasCtx.fillStyle = `rgb(0, ${barHeight + 100}, 255)`;
                    canvasCtx.fillRect(x, visualizer.height - barHeight, barWidth - 1, barHeight);
                    x += barWidth;
                }
            }
            draw();
        }

        function toggleMute() {
            if(!localStream) return;
            isMuted = !isMuted;
            
            muteGainNode.gain.value = isMuted ? 0.0 : 1.0;
            
            const statusTxt = document.getElementById('micStatus');
            const btn = document.getElementById('muteBtn');
            
            if(isMuted) {
                playSound('off');
                statusTxt.innerText = "KAPALI";
                statusTxt.style.color = "#ff0055";
                btn.innerText = "Mikrofonu Aç (M)";
            } else {
                playSound('on');
                statusTxt.innerText = "AKTİF";
                statusTxt.style.color = "#0ff";
                btn.innerText = "Mikrofonu Kapat (M)";
            }
        }

        function startPtt(e) {
            if(e) e.preventDefault();
            if(isMuted && !isPttActive && localStream) {
                isPttActive = true;
                muteGainNode.gain.value = 1.0; 
                playSound('on');
                document.getElementById('micStatus').innerText = "KONUŞUYOR (V)";
                document.getElementById('micStatus').style.color = "#ffaa00";
                pttBtn.classList.add("active-ptt");
            }
        }

        function stopPtt(e) {
            if(e) e.preventDefault();
            if(isMuted && isPttActive && localStream) {
                isPttActive = false;
                muteGainNode.gain.value = 0.0; 
                playSound('off');
                document.getElementById('micStatus').innerText = "KAPALI";
                document.getElementById('micStatus').style.color = "#ff0055";
                pttBtn.classList.remove("active-ptt");
            }
        }

        pttBtn.addEventListener('touchstart', startPtt, {passive: false});
        pttBtn.addEventListener('touchend', stopPtt);
        pttBtn.addEventListener('touchcancel', stopPtt);
        
        pttBtn.addEventListener('mousedown', startPtt);
        window.addEventListener('mouseup', stopPtt);

        document.addEventListener('keydown', (e) => {
            if(e.target.tagName === 'INPUT') return; 
            if(e.code === 'KeyM') toggleMute();
            if(e.code === 'KeyV' && isMuted && !isPttActive) {
                startPtt(); 
            }
        });

        document.addEventListener('keyup', (e) => {
            if(e.code === 'KeyV' && isMuted && isPttActive) {
                stopPtt(); 
            }
        });
    </script>
</body>
</html>
