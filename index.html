<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Tarzı Sesli Oda</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; margin-top: 50px; background-color: #36393f; color: #dcddde; }
        .container { background: #2f3136; padding: 30px; border-radius: 8px; display: inline-block; box-shadow: 0 4px 15px rgba(0,0,0,0.3); width: 350px; }
        input { width: 80%; padding: 10px; border-radius: 5px; border: 1px solid #202225; background: #40444b; color: white; margin-bottom: 15px; outline: none; }
        button { padding: 10px 20px; font-size: 14px; font-weight: bold; cursor: pointer; background: #5865F2; color: white; border: none; border-radius: 5px; transition: 0.2s; width: 85%; margin-bottom: 10px; }
        button:hover { background: #4752C4; }
        .btn-danger { background: #ed4245; }
        .btn-danger:hover { background: #c03537; }
        #status { margin-top: 15px; font-weight: bold; color: #43b581; font-size: 15px; }
        .controls { display: none; margin-top: 20px; text-align: left; background: #202225; padding: 15px; border-radius: 5px; font-size: 13px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>🎙️ Sesli Odaya Katıl</h2>
        
        <div id="setupScreen">
            <p>Oda adını yazıp katıl veya oluştur:</p>
            <input type="text" id="roomName" placeholder="Örn: gizlioda-123" autocomplete="off">
            <br>
            <button onclick="joinRoom()">Odaya Gir</button>
        </div>

        <p id="status"></p>

        <div id="controlsScreen" class="controls">
            <p>🟢 <b>Durum:</b> <span id="micStatus" style="color: #43b581;">Mikrofon Açık</span></p>
            <button id="muteBtn" onclick="toggleMute()" class="btn-danger">Mikrofonu Kapat (M)</button>
            <hr style="border-color: #40444b; margin: 15px 0;">
            <p>⌨️ <b>Kısayollar (Tarayıcı Açıkken):</b></p>
            <ul style="padding-left: 20px; margin-top: 5px;">
                <li><b>M:</b> Mikrofonu Aç/Kapat</li>
                <li><b>V:</b> Bas Konuş (Basılı Tut)</li>
            </ul>
        </div>

        <audio id="remoteAudio" autoplay></audio>
    </div>

    <script>
        let peer;
        let localStream;
        let isMuted = false;
        let isPttActive = false;

        // Bip sesleri (Harici dosya gerektirmemesi için Web Audio API ile üretildi)
        function playSound(type) {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            gain.connect(ctx.destination);
            osc.connect(gain);
            
            if (type === 'on') {
                osc.frequency.setValueAtTime(600, ctx.currentTime);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                osc.start(); osc.stop(ctx.currentTime + 0.15);
            } else {
                osc.frequency.setValueAtTime(300, ctx.currentTime);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                osc.start(); osc.stop(ctx.currentTime + 0.15);
            }
        }

        // Gürültü Engelleme (Noise Cancellation) Ayarları
        const audioConstraints = {
            audio: {
                echoCancellation: true,
                noiseSuppression: true,
                autoGainControl: true
            },
            video: false
        };

        function joinRoom() {
            const roomInput = document.getElementById('roomName').value.trim();
            if(!roomInput) return alert("Lütfen bir oda adı girin!");

            document.getElementById('setupScreen').style.display = 'none';
            document.getElementById('status').innerText = "Bağlanıyor...";
            document.getElementById('status').style.color = "#faa61a";

            // Benzersizliği artırmak için ön ek ekliyoruz
            const hostId = "oda-" + roomInput; 
            
            peer = new Peer();

            peer.on('open', (id) => {
                // Önce odayı kuran kişi var mı diye bağlanmayı deniyoruz
                const conn = peer.connect(hostId);
                
                conn.on('open', () => {
                    // Oda sahibi zaten var, odaya katılıyoruz
                    startCall(hostId);
                });

                // Eğer bağlanamazsak, odayı biz kuruyoruz demektir
                peer.on('error', (err) => {
                    if(err.type === 'peer-unavailable') {
                        peer.destroy();
                        peer = new Peer(hostId); // Odayı bizim adımızla kur
                        peer.on('open', () => {
                            setupMedia();
                            document.getElementById('status').innerText = "Oda Kuruldu. Arkadaşın Bekleniyor...";
                            document.getElementById('status').style.color = "#43b581";
                        });
                        
                        peer.on('call', (call) => {
                            call.answer(localStream);
                            call.on('stream', (remoteStream) => {
                                document.getElementById('remoteAudio').srcObject = remoteStream;
                                document.getElementById('status').innerText = "Bağlantı Aktif!";
                            });
                        });
                    }
                });
            });
        }

        function setupMedia(callback) {
            navigator.mediaDevices.getUserMedia(audioConstraints)
                .then((stream) => {
                    localStream = stream;
                    document.getElementById('controlsScreen').style.display = 'block';
                    if(callback) callback();
                })
                .catch((err) => { alert("Mikrofon izni gerekli!"); });
        }

        function startCall(remoteId) {
            setupMedia(() => {
                const call = peer.call(remoteId, localStream);
                call.on('stream', (remoteStream) => {
                    document.getElementById('remoteAudio').srcObject = remoteStream;
                    document.getElementById('status').innerText = "Odaya Katıldın. Bağlantı Aktif!";
                    document.getElementById('status').style.color = "#43b581";
                });
            });
        }

        // Mikrofon Susturma Mantığı
        function toggleMute() {
            if(!localStream) return;
            isMuted = !isMuted;
            localStream.getAudioTracks()[0].enabled = !isMuted;
            
            const statusTxt = document.getElementById('micStatus');
            const btn = document.getElementById('muteBtn');
            
            if(isMuted) {
                playSound('off');
                statusTxt.innerText = "Susturuldu";
                statusTxt.style.color = "#ed4245";
                btn.innerText = "Mikrofonu Aç (M)";
                btn.style.background = "#43b581";
            } else {
                playSound('on');
                statusTxt.innerText = "Açık";
                statusTxt.style.color = "#43b581";
                btn.innerText = "Mikrofonu Kapat (M)";
                btn.style.background = "#ed4245";
            }
        }

        // Kısayol Tuşları (Tarayıcı odaktayken çalışır)
        document.addEventListener('keydown', (e) => {
            if(e.target.tagName === 'INPUT') return; // Yazı yazarken tetiklenmesin
            
            // M Tuşu - Sustur/Aç
            if(e.code === 'KeyM') {
                toggleMute();
            }
            
            // V Tuşu - Bas Konuş
            if(e.code === 'KeyV' && isMuted && !isPttActive) {
                isPttActive = true;
                localStream.getAudioTracks()[0].enabled = true;
                playSound('on');
                document.getElementById('micStatus').innerText = "Bas Konuş Aktif";
                document.getElementById('micStatus').style.color = "#faa61a";
            }
        });

        document.addEventListener('keyup', (e) => {
            // V Tuşu - Bırakınca tekrar sustur
            if(e.code === 'KeyV' && isMuted && isPttActive) {
                isPttActive = false;
                localStream.getAudioTracks()[0].enabled = false;
                playSound('off');
                document.getElementById('micStatus').innerText = "Susturuldu";
                document.getElementById('micStatus').style.color = "#ed4245";
            }
        });
    </script>
</body>
</html>
