<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NXY SESLİ</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Rajdhani', sans-serif; 
            background: #040710; 
            color: #0ff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
            overflow: hidden;
            background-image: radial-gradient(circle at center, #0a1128 0%, #040710 100%);
            padding: 15px;
        }

        .hud-container {
            width: 100%;
            max-width: 380px;
            text-align: center;
            position: relative;
            padding: 40px 20px;
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 30px;
            letter-spacing: 3px;
            text-shadow: 0 0 15px rgba(0, 255, 255, 0.8);
            color: #e0ffff;
        }

        /* Siber Köşebentli Input ve Buton Tasarımı */
        .cyber-box {
            position: relative;
            margin-bottom: 20px;
            padding: 2px;
        }

        .cyber-box::before, .cyber-box::after {
            content: ''; position: absolute; width: 20px; height: 10px; border: 2px solid #0ff;
            box-shadow: 0 0 8px rgba(0, 255, 255, 0.5);
            pointer-events: none;
        }
        .cyber-box::before { top: 0; left: 0; border-right: 0; border-bottom: 0; }
        .cyber-box::after { bottom: 0; right: 0; border-left: 0; border-top: 0; }

        input {
            width: 100%;
            padding: 15px;
            background: rgba(0, 20, 40, 0.4);
            border: 1px solid rgba(0, 255, 255, 0.2);
            color: #0ff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
            font-weight: 600;
            outline: none;
            text-align: center;
            letter-spacing: 1px;
            backdrop-filter: blur(5px);
        }

        button {
            width: 100%;
            padding: 15px;
            background: rgba(0, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 255, 0.3);
            color: #0ff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
            backdrop-filter: blur(5px);
        }

        button:active { background: rgba(0, 255, 255, 0.2); box-shadow: 0 0 20px rgba(0, 255, 255, 0.6); }

        .btn-danger { color: #ff3366; border-color: rgba(255, 51, 102, 0.3); }
        .btn-danger-box::before, .btn-danger-box::after { border-color: #ff3366; box-shadow: 0 0 8px rgba(255, 51, 102, 0.5); }
        .btn-danger:active { background: rgba(255, 51, 102, 0.2); box-shadow: 0 0 20px rgba(255, 51, 102, 0.6); }

        #status { font-size: 14px; font-weight: 600; letter-spacing: 1px; margin-bottom: 25px; height: 20px;}
        
        .controls { display: none; margin-top: 30px; }
        
        /* Sürekli Akan Dalga Gösterici */
        canvas {
            width: 100%;
            height: 80px;
            margin: 20px 0;
            display: none;
        }

        .status-text {
            font-size: 16px;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .info-text {
            font-size: 12px;
            color: #4a6b8c;
            margin-top: 20px;
            letter-spacing: 0.5px;
        }
        .info-text span { color: #0ff; }
    </style>
</head>
<body>

    <div class="hud-container">
        <h1>NXY SESLİ</h1>
        
        <div id="setupScreen">
            <div class="cyber-box">
                <button onclick="joinRoom()">ODAYA BAĞLAN</button>
            </div>
            <div class="cyber-box" style="margin-top: 15px;">
                <input type="text" id="roomName" placeholder="ODA ADINI YAZIN" autocomplete="off">
            </div>
        </div>

        <canvas id="visualizer"></canvas>
        <p id="status"></p>

        <div id="controlsScreen" class="controls">
            <p class="status-text">MİKROFON: <span id="micStatus" style="color: #0ff; text-shadow: 0 0 8px #0ff;">AKTİF</span></p>
            
            <div class="cyber-box btn-danger-box">
                <button id="muteBtn" onclick="toggleMute()" class="btn-danger">MİKROFONU KAPAT (M)</button>
            </div>
            
            <p class="info-text">Gürültü Filtresi: <span style="color: #0ff;">Aktif (Dinamik Highpass)</span></p>
        </div>

        <audio id="remoteAudio" autoplay></audio>
    </div>

    <script>
        let peer;
        let localStream;
        let isMuted = false;
        let audioCtx;
        let gainNode;

        const statusEl = document.getElementById('status');
        const visualizer = document.getElementById('visualizer');
        const canvasCtx = visualizer.getContext('2d');

        // Net ses için sadece varsayılan gürültü engellemeyi kullanıyoruz, AutoGainControl kapalı
        const audioConstraints = {
            audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: false, sampleRate: 48000 },
            video: false
        };

        function joinRoom() {
            const roomInput = document.getElementById('roomName').value.trim().toLowerCase();
            if(!roomInput) return alert("Oda adı girin!");

            document.getElementById('setupScreen').style.display = 'none';
            statusEl.innerText = "BAĞLANTI KURULUYOR...";
            statusEl.style.color = "#0ff";

            const hostId = "nxy-v3-" + roomInput; 
            
            peer = new Peer({ config: { 'iceServers': [ { url: 'stun:stun.l.google.com:19302' } ] } });

            peer.on('open', (id) => {
                const conn = peer.connect(hostId);
                conn.on('open', () => { startCall(hostId); });

                peer.on('error', (err) => {
                    if(err.type === 'peer-unavailable') {
                        peer.destroy();
                        peer = new Peer(hostId, { config: { 'iceServers': [ { url: 'stun:stun.l.google.com:19302' } ] } });
                        peer.on('open', () => {
                            setupMedia();
                            statusEl.innerText = "BAĞLANTI BEKLENİYOR...";
                        });
                        peer.on('call', (call) => {
                            call.answer(localStream);
                            call.on('stream', (remoteStream) => {
                                document.getElementById('remoteAudio').srcObject = remoteStream;
                                statusEl.innerText = "";
                            });
                        });
                    }
                });
            });
        }

        function setupMedia(callback) {
            navigator.mediaDevices.getUserMedia(audioConstraints)
                .then((stream) => {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const source = audioCtx.createMediaStreamSource(stream);
                    
                    // Sesi boğmamak için sadece çok düşük uğultuları kesen Highpass filtresi (80Hz altı)
                    const highpassFilter = audioCtx.createBiquadFilter();
                    highpassFilter.type = "highpass";
                    highpassFilter.frequency.value = 80;

                    gainNode = audioCtx.createGain();
                    gainNode.gain.value = 1.0; 

                    source.connect(highpassFilter);
                    highpassFilter.connect(gainNode);

                    const destination = audioCtx.createMediaStreamDestination();
                    gainNode.connect(destination);
                    localStream = destination.stream;

                    document.getElementById('controlsScreen').style.display = 'block';
                    visualizer.style.display = 'block';
                    
                    startVisualizer(highpassFilter); 
                    
                    if(callback) callback();
                })
                .catch((err) => { alert("Mikrofon izni gerekli!"); });
        }

        function startCall(remoteId) {
            setupMedia(() => {
                const call = peer.call(remoteId, localStream);
                call.on('stream', (remoteStream) => {
                    document.getElementById('remoteAudio').srcObject = remoteStream;
                    statusEl.innerText = "";
                });
            });
        }

        // İstediğin akıcı ince çizgi (Sine Wave) görselleştiricisi
        function startVisualizer(audioNode) {
            const analyser = audioCtx.createAnalyser();
            analyser.fftSize = 512;
            audioNode.connect(analyser);
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);

            function draw() {
                requestAnimationFrame(draw);
                analyser.getByteTimeDomainData(dataArray); // Bloklar yerine dalga formu verisi çekilir
                
                canvasCtx.clearRect(0, 0, visualizer.width, visualizer.height);
                
                canvasCtx.lineWidth = 2;
                canvasCtx.strokeStyle = '#0ff';
                canvasCtx.shadowBlur = 10;
                canvasCtx.shadowColor = '#0ff';
                canvasCtx.beginPath();

                let sliceWidth = visualizer.width * 1.0 / bufferLength;
                let x = 0;
                let maxVolume = 0;

                for(let i = 0; i < bufferLength; i++) {
                    let v = dataArray[i] / 128.0;
                    let y = v * (visualizer.height / 2);

                    if(i === 0) canvasCtx.moveTo(x, y);
                    else canvasCtx.lineTo(x, y);

                    x += sliceWidth;
                    
                    let volCalc = Math.abs(dataArray[i] - 128);
                    if(volCalc > maxVolume) maxVolume = volCalc;
                }
                
                canvasCtx.lineTo(visualizer.width, visualizer.height / 2);
                canvasCtx.stroke();

                // Gürültü Kapısı (Noise Gate) - Eşik çok düşük tutuldu ki sesi kesmesin
                if (maxVolume < 3) {
                    gainNode.gain.value = 0.0;
                } else {
                    gainNode.gain.value = 1.0;
                }
            }
            draw();
        }

        function toggleMute() {
            if(!localStream) return;
            isMuted = !isMuted;
            localStream.getAudioTracks()[0].enabled = !isMuted;
            
            const statusTxt = document.getElementById('micStatus');
            const btn = document.getElementById('muteBtn');
            const btnBox = btn.parentElement;
            
            if(isMuted) {
                statusTxt.innerText = "KAPALI";
                statusTxt.style.color = "#ff3366";
                statusTxt.style.textShadow = "0 0 8px #ff3366";
                btn.innerText = "MİKROFONU AÇ (M)";
                btn.className = "";
                btn.style.color = "#0ff";
                btn.style.borderColor = "rgba(0, 255, 255, 0.3)";
                btnBox.className = "cyber-box";
            } else {
                statusTxt.innerText = "AKTİF";
                statusTxt.style.color = "#0ff";
                statusTxt.style.textShadow = "0 0 8px #0ff";
                btn.innerText = "MİKROFONU KAPAT (M)";
                btn.className = "btn-danger";
                btn.style.color = "";
                btn.style.borderColor = "";
                btnBox.className = "cyber-box btn-danger-box";
            }
        }

        document.addEventListener('keydown', (e) => {
            if(e.target.tagName === 'INPUT') return; 
            if(e.code === 'KeyM') toggleMute();
        });
    </script>
</body>
</html>
